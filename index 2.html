<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>렌즈 달력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-window app (desktop-first). Title bar, then a month grid whose selected day swells to fill most of the screen while its neighbours are pressed thin, then a one-line add bar. */
:root{
  --bg:#ffffff;
  --bg2:#f4f4f2;
  --ink:#111111;
  --mute:#7b7b77;
  --line:#cfcfca;
  --font:'IBM Plex Sans KR',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e0e0e;--bg2:#171716;--ink:#f1f1ee;--mute:#8e8e8a;--line:#363633;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e0e0e;--bg2:#171716;--ink:#f1f1ee;--mute:#8e8e8a;--line:#363633;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font)}
.stage{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scaler{width:100%;height:100%}
.device{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg)}
.chrome,.hint{display:none}
.chrome .island{position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:3}
.chrome .time{position:absolute;top:19px;left:46px;font-size:17px;font-weight:700;line-height:20px;font-variant-numeric:tabular-nums;z-index:3}
.chrome .sig{position:absolute;top:22px;right:82px;display:flex;align-items:flex-end;gap:2px;height:12px;z-index:3}
.chrome .sig i{display:block;width:3px;background:var(--ink);border-radius:1px}
.chrome .sig i:nth-child(1){height:4px}.chrome .sig i:nth-child(2){height:6px}.chrome .sig i:nth-child(3){height:9px}.chrome .sig i:nth-child(4){height:12px}
.chrome .bat{position:absolute;top:22px;right:44px;width:26px;height:13px;border:1px solid var(--mute);border-radius:4px;padding:1px;box-sizing:border-box;z-index:3}
.chrome .bat b{display:block;width:80%;height:100%;background:var(--ink);border-radius:2px}
.chrome .home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:3}
.top{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:20px 16px 8px}
.ym{display:flex;flex-direction:column;min-width:0;position:relative}
canvas#tcv{position:static;inset:auto;display:block;width:132px;height:62px;cursor:default;touch-action:auto}
@media (min-width:700px){canvas#tcv{width:176px;height:84px}}
canvas#tdcv{position:static;inset:auto;display:block;cursor:pointer;touch-action:auto;opacity:.55;transition:opacity .12s}
.ctl button:hover canvas#tdcv,.ctl button:active canvas#tdcv{opacity:1}
.ctl button{position:relative;isolation:isolate}
.ctl button::before{content:'';position:absolute;inset:-8px -14px;z-index:-1;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(closest-side,rgba(128,128,128,.28),rgba(128,128,128,0))}
@supports (background:color-mix(in srgb,red,blue)){.ctl button::before{background:radial-gradient(closest-side,color-mix(in srgb,var(--ink) 16%,transparent),color-mix(in srgb,var(--ink) 0%,transparent))}}
.ctl button:active::before{opacity:1}
@media (hover:hover){.ctl button:hover::before{opacity:1}.ctl button:hover{background:transparent}}
.ctl button:active{background:transparent}
#ylabel,h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#ylabel{font-size:12px;color:var(--mute);letter-spacing:.04em;font-variant-numeric:tabular-nums}
h1{margin:0;font-size:30px;line-height:1.1;font-weight:500;letter-spacing:-.01em}
.ctl{display:flex;gap:6px}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;padding:0 12px;height:34px;cursor:pointer;border-radius:0;transition:background .12s,color .12s,box-shadow .12s}
.ctl button{color:var(--mute)}
@media (hover:hover){button:hover{background:var(--bg2);color:var(--ink)}}
button:active{background:var(--bg2);color:var(--ink)}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cal{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
canvas.drag{cursor:grabbing}
#inl{position:absolute;display:none;z-index:2;box-sizing:border-box;font:inherit;font-weight:500;color:var(--ink);background:var(--bg2);border:0;border-radius:8px;padding:0 10px;outline:none;box-shadow:0 0 0 1.5px var(--ink)}
#inl::placeholder{color:var(--mute);font-weight:400}
@media (min-width:700px){.top{padding:28px 40px 14px}#ylabel{font-size:14px}button{font-size:16px;height:40px;padding:0 16px}.cal{padding:0 40px 32px;box-sizing:border-box}}
.hint{margin:0;font-size:13px;line-height:1.6;color:var(--mute);max-width:390px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<div class="stage">
 <div class="scaler" id="scaler">
  <div class="device" id="device">
  <div class="chrome" aria-hidden="true">
    <span class="time" id="clock">9:41</span>
    <span class="island"></span>
    <span class="sig"><i></i><i></i><i></i><i></i></span>
    <span class="bat"><b></b></span>
    <span class="home"></span>
  </div>
  <div class="app">
    <div class="top">
      <div class="ym"><canvas id="tcv" aria-hidden="true"></canvas><span id="ylabel"></span><h1 id="mlabel">&nbsp;</h1></div>
      <div class="ctl">
        <button id="prev" type="button" aria-label="이전 달">←</button>
        <button id="today" type="button" aria-label="오늘"><canvas id="tdcv" aria-hidden="true"></canvas></button>
        <button id="next" type="button" aria-label="다음 달">→</button>
      </div>
    </div>

    <div class="cal" id="cal">
      <canvas id="cv" tabindex="0" aria-label="월 달력. 선택한 날짜 칸이 크게 확대되고 주변 칸은 좁아집니다. 방향키로 날짜를 옮깁니다."></canvas>
      <input id="inl" type="text" autocomplete="off" placeholder="할 일 입력 후 Enter" aria-label="할 일 추가">
    </div>
  </div>
  </div>
 </div>
  <p class="hint">달력을 드래그하면 확대된 칸이 따라 움직이고, 놓으면 가까운 날짜에 멈춥니다. 방향키는 하루씩, PageUp과 PageDown은 한 달씩 이동합니다. 채워진 할 일은 예시입니다.</p>
  <p class="sr" id="live" aria-live="polite"></p>
</div>

<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), wrap=document.getElementById('cal');
  var DOW=['일','월','화','수','목','금','토'];
  var DOWF=DOW.map(function(d){return d+'요일'});
  var FAM='"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  var HEAD=30;
  var CW=[6.5,.336,.544,.72,.8,.8,.8,.8];
  var RW=[4.4,.4,.624,.8,.8,.8,.8];
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var T=new Date();
  var ym={y:T.getFullYear(),m:T.getMonth()};
  var pa=1,pv=0,morphFrom='',morphT=1,leaving=[],closedAt=0,sel=T.getDate(),listOpen=false,listA=0,hovA=0,hovOn=false,lox=0,loy=0;
  var W=0,H=0,dpr=1,inf=null,lastKey='';
  var fc=0,fr=0,tc=0,tr=0,dragging=false;
  var G={xs:[],ys:[],rows:5};
  var hits=[],cellD=0,cellRed=false,pillInfo=null;
  /* jelly grid: the mouse shoves the lines along its direction; a spring lets them wobble back */
  var jx=0,jy=0,jvx=0,jvy=0,mx=-999,my=-999,tmx=-999,tmy=-999,act=0,phase=0,ptx=0,pty=0;
  /* 대한민국 공휴일(대체공휴일 포함) 2026-2027 */
  var HOL={'2026-1-1':1,'2026-2-16':1,'2026-2-17':1,'2026-2-18':1,'2026-3-1':1,'2026-3-2':1,'2026-5-5':1,'2026-5-24':1,'2026-5-25':1,'2026-6-3':1,'2026-6-6':1,'2026-8-15':1,'2026-8-17':1,'2026-9-24':1,'2026-9-25':1,'2026-9-26':1,'2026-10-3':1,'2026-10-5':1,'2026-10-9':1,'2026-12-25':1,
    '2027-1-1':1,'2027-2-6':1,'2027-2-7':1,'2027-2-8':1,'2027-2-9':1,'2027-3-1':1,'2027-5-5':1,'2027-5-13':1,'2027-6-6':1,'2027-8-15':1,'2027-8-16':1,'2027-9-14':1,'2027-9-15':1,'2027-9-16':1,'2027-10-3':1,'2027-10-4':1,'2027-10-9':1,'2027-10-11':1,'2027-12-25':1,'2027-12-27':1};
  var todos={};
  var KEY='lens-calendar-v4';

  function key(y,m,d){return y+'-'+(m+1)+'-'+d}
  function info(){
    var start=new Date(ym.y,ym.m,1).getDay();
    var N=new Date(ym.y,ym.m+1,0).getDate();
    return {start:start,N:N,rows:Math.ceil((start+N)/7)};
  }
  function list(d){return todos[key(ym.y,ym.m,d)]||[]}
  function ss(v,a,b){var t=Math.max(0,Math.min(1,(v-a)/(b-a)));return t*t*(3-2*t)}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function interp(tbl,d){
    d=Math.abs(d);
    var i=Math.min(Math.floor(d),tbl.length-2);
    var f=Math.min(d-i,1);
    return tbl[i]+(tbl[i+1]-tbl[i])*f;
  }

  var seed={2:['쇼츠 대본 검수'],5:['11월 광고 예산 정리'],6:['신상 문구 샘플 발주'],
    7:['정산 내역 확인','광고 키워드 점검','쇼츠 업로드 15:00','샘플 입고 확인'],
    8:['택배 출고 마감 14:00','스마트스토어 가격 수정'],9:['반품 처리'],
    12:['주간 매출 정리','광고비 충전'],14:['정산 입금 확인'],15:['신상품 촬영'],
    19:['쇼츠 3편 예약 업로드'],21:['광고비 충전','재고 실사'],26:['월말 정산 준비'],
    28:['상세페이지 검수'],30:['11.11 행사 상품 등록 마감'],31:['월 매출 마감']};

  function load(){
    try{var s=localStorage.getItem(KEY);if(s){todos=JSON.parse(s)||{};Object.keys(todos).forEach(function(k){todos[k]=(todos[k]||[]).filter(function(o){return !o.d})});return}}catch(e){}
    todos={};
    var today=T.getDate();
    Object.keys(seed).forEach(function(d){
      todos[key(ym.y,ym.m,+d)]=seed[d].map(function(t,i){
        return {t:t,d:false};
      });
    });
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(todos))}catch(e){}}

  function ensureFont(str){
    if(!document.fonts||!document.fonts.load)return;
    [400,500,700].forEach(function(w){
      document.fonts.load(w+' 20px "IBM Plex Sans KR"',str).then(function(){kick()},function(){});
    });
  }

  function labels(){
    document.getElementById('ylabel').textContent=ym.y;
    document.getElementById('mlabel').textContent=(ym.m+1)+'월';
    var dow=new Date(ym.y,ym.m,sel).getDay();
    document.getElementById('live').textContent=(ym.m+1)+'월 '+sel+'일 '+DOWF[dow]+', 할 일 '+list(sel).length+'개';
  }

  function setTarget(snap){
    var idx=inf.start+sel-1;
    tc=idx%7;tr=Math.floor(idx/7);
    if(snap){fc=tc;fr=tr}
  }
  function goDay(d,snap){
    d=Math.max(1,Math.min(inf.N,d));
    if(d!==sel){listOpen=false;morphFrom=String(sel);morphT=0;pv+=7}sel=d;setTarget(snap);labels();kick();
  }
  function updateSel(d){if(d!==sel){morphFrom=String(sel);morphT=0;pv+=7;sel=d;listOpen=false;labels()}}
  function shiftMonth(delta){
    var d=new Date(ym.y,ym.m+delta,1);
    ym={y:d.getFullYear(),m:d.getMonth()};
    layout(true);
    goDay(sel,true);
  }

  function colors(){
    var cs=getComputedStyle(document.documentElement);
    function g(n,fb){return cs.getPropertyValue(n).trim()||fb}
    return {bg:g('--bg','#fff'),bg2:g('--bg2','#f4f4f2'),ink:g('--ink','#111'),mute:g('--mute','#777'),line:g('--line','#ccc')};
  }

  /* text that is squeezed sideways when its cell is narrow, and cut with an ellipsis only after that */
  function put(txt,x,y,maxW){
    var tw=ctx.measureText(txt).width,sx=1,t=txt;
    if(tw>maxW){
      sx=Math.max(.55,maxW/tw);
      if(tw*sx>maxW+.5){
        var n=t.length;
        while(n>1&&ctx.measureText(t.slice(0,n)+'…').width*sx>maxW)n--;
        t=t.slice(0,n)+'…';
      }
    }
    ctx.save();ctx.translate(x,y);ctx.scale(sx,1);ctx.fillText(t,0,0);ctx.restore();
    return ctx.measureText(t).width*sx;
  }
  function wrapLines(s,maxW,fs,wt){
    ctx.font=wt+' '+fs+'px '+FAM;
    var words=s.split(' '),lines=[],cur='';
    words.forEach(function(wd){
      var t=cur?cur+' '+wd:wd;
      if(ctx.measureText(t).width<=maxW){cur=t;return}
      if(cur){lines.push(cur);cur=''}
      if(ctx.measureText(wd).width<=maxW){cur=wd;return}
      var part='';
      for(var i=0;i<wd.length;i++){
        var t2=part+wd.charAt(i);
        if(ctx.measureText(t2).width>maxW&&part){lines.push(part);part=wd.charAt(i)}else part=t2;
      }
      cur=part;
    });
    if(cur)lines.push(cur);
    return lines.length?lines:[''];
  }

  function rr(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }
  /* the "+ 추가" button: soft filled pill behind the label */
  function addPill(x,pad,cellW,yy,lf,lh,C,alpha,isFocus){
    var af=lf*.95,label='+ 추가';
    ctx.save();ctx.textBaseline='middle';ctx.textAlign='left';
    ctx.font='500 '+af+'px '+FAM;
    var tw=ctx.measureText(label).width,ph=lh*1.12,pw=tw+af*1.2,py=yy+(lh*1.3-ph)/2;
    var px=x+(cellW-pw)/2;
    ctx.globalAlpha=alpha*.55;ctx.fillStyle=C.line;rr(px,py,pw,ph,Math.min(10,ph*.3));ctx.fill();
    ctx.globalAlpha=alpha;ctx.fillStyle=C.ink;ctx.fillText(label,px+af*.6,py+ph/2);
    ctx.restore();
    if(isFocus&&alpha>.9)hits.push({k:'a',x:px,y:py,w:pw,h:ph,cx:x,cw:cellW,fs:af,i:-1});
  }
  function check(bx,by,s,col){
    ctx.save();
    ctx.strokeStyle=col;ctx.lineWidth=Math.max(1.6,s*.14);ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(bx+s*.2,by+s*.54);ctx.lineTo(bx+s*.42,by+s*.76);ctx.lineTo(bx+s*.82,by+s*.26);
    ctx.stroke();ctx.restore();
  }

  /* the enlarged day: every to-do wrapped onto as many lines as it needs, font shrunk only if the list would not fit */
  var LEAVE_HOLD=160,LEAVE_DUR=460;
  function leaveP(o){
    for(var i=0;i<leaving.length;i++)if(leaving[i].o===o){
      var p=Math.max(0,Math.min(1,(performance.now()-leaving[i].t0-LEAVE_HOLD)/LEAVE_DUR));
      return p*p*(3-2*p);
    }
    return 0;
  }
  function bigList(x,y,w,h,items,C,numFs,pad,alpha,isFocus){
    var avail=h-pad*2-0;
    var lfMax=clamp(Math.min(w/10.5,h/14),13,W>900?32:23),lf=lfMax,lay,i,it;
    var maxRow=Math.min(w-pad*2,Math.max(260,w*.62));
    for(it=0;it<9;it++){
      var bs=lf*.78,gap=lf*.55,xw0=lf*1.4,textW=maxRow-bs-gap-xw0-gap,lh=lf*1.36;
      var rows=[],used=0;
      for(i=0;i<items.length;i++){
        var ls=wrapLines(items[i].t,textW,lf,500),hh=ls.length*lh+lf*.6;
        var lv=leaveP(items[i]);rows.push({ls:ls,h:hh,i:i,hs:hh*(1-lv),a:1-lv});used+=hh;
      }
      lay={lf:lf,bs:bs,gap:gap,xw0:xw0,lh:lh,rows:rows,used:used};
      if(used+lf*2.6<=avail||lf<=13)break;
      lf=Math.max(13,lf*.9);
    }
    var rows2=lay.rows.slice(),used2=lay.used;
    while(rows2.length>1&&used2+lay.lh*2.6>avail){used2-=rows2.pop().h}
    var rest=items.length-rows2.length;
    used2=0;rows2.forEach(function(r){used2+=r.hs});
    var total=used2+(rest>0?lay.lh*1.2:0)+lay.lh*1.4;
    var top=y+Math.max(pad,(h-total)/2);
    ctx.save();ctx.globalAlpha=alpha;ctx.textBaseline='middle';ctx.textAlign='left';
    var yy=top;
    for(i=0;i<rows2.length;i++){
      var row=rows2[i],o=items[row.i],y0=yy+(row.hs-row.h)/2,cy=y0+lay.lh/2;ctx.globalAlpha=alpha*row.a;
      ctx.font='500 '+lay.lf+'px '+FAM;
      var lw=0,j;
      for(j=0;j<row.ls.length;j++)lw=Math.max(lw,ctx.measureText(row.ls[j]).width);
      var xw=0;ctx.font='400 '+lay.lf*1.15+'px '+FAM;xw=ctx.measureText('×').width;
      var rowW=lay.bs+lay.gap+lw+lay.gap+xw,gx=x+(w-rowW)/2;
      ctx.strokeStyle=C.ink;ctx.lineWidth=1.4;
      rr(gx+.5,cy-lay.bs/2+.5,lay.bs,lay.bs,lay.bs*.14);ctx.stroke();
      if(o.d)check(gx+.5,cy-lay.bs/2+.5,lay.bs,C.ink);
      ctx.font='500 '+lay.lf+'px '+FAM;
      ctx.fillStyle=o.d?C.mute:C.ink;
      var tx=gx+lay.bs+lay.gap;
      for(j=0;j<row.ls.length;j++){
        var ly2=y0+lay.lh*(j+.5),tw2=ctx.measureText(row.ls[j]).width;
        ctx.fillText(row.ls[j],tx,ly2);
      }
      ctx.fillStyle=C.mute;ctx.font='400 '+lay.lf*1.15+'px '+FAM;
      var xx=tx+lw+lay.gap;
      ctx.fillText('×',xx,cy);
      if(isFocus&&alpha>.9&&row.a>.99){
        hits.push({k:'t',x:gx-6,y:yy,w:rowW-xw-lay.gap+6,h:row.h,i:row.i});
        hits.push({k:'x',x:xx-lay.gap*.5,y:yy,w:xw+lay.gap*1.5,h:row.h,i:row.i});
      }
      yy+=row.hs;
    }
    ctx.globalAlpha=alpha;
    ctx.font='400 '+lay.lf*.92+'px '+FAM;ctx.fillStyle=C.mute;ctx.textAlign='center';
    if(rest>0){
      ctx.fillText('+ '+rest+'개 더',x+w/2,yy+lay.lh*.6);yy+=lay.lh*1.2;
    }
    ctx.restore();
    if(rest===0&&yy+lay.lh*1.2<=y+h-pad+2){if(C.inv)pillInfo={yy:yy,lf:lay.lf,lh:lay.lh};else addPill(x,pad,w,yy,lay.lf,lay.lh,C,alpha,isFocus)}
  }

  /* modular numerals built from circles, half-discs and pills on a 2x3 grid */
  var GD={
    '0':[['L',0,0,1,3],['R',1,0,1,3]],
    '1':[['o',.5,0,1,1],['P',.5,1.1,1,1.9]],
    '2':[['o',0,0,1,1],['R',1,0,1,1.45],['L',0,1.6,1,1.4],['P',1.1,2.1,.9,.9]],

    var id=c.getImageData(0,0,W,H),d=id.data,al=new Float32Array(W*H),i;
    c.setTransform(1,0,0,1,0,0);
    for(i=0;i<al.length;i++)al[i]=d[i*4+3]/255;
    var rb=Math.max(1,Math.round(RB*u*dpr));
    for(i=0;i<3;i++)boxBlur(al,W,H,rb);
    var sl=Math.max(3,rb*2.2);
    for(i=0;i<al.length;i++){var v=(al[i]-.5)*sl+.5;d[i*4+3]=Math.round(255*(v<0?0:v>1?1:v));d[i*4]=d[i*4+1]=d[i*4+2]=0}
    c.putImageData(id,0,0);
    c.globalCompositeOperation='source-in';c.fillStyle=col;c.fillRect(0,0,W,H);c.globalCompositeOperation='source-over';
    tctx.save();tctx.setTransform(1,0,0,1,0,0);tctx.drawImage(moc,0,0);tctx.restore();
    /* M and T reuse the weekday-header glyphs */
    for(k=0;k<str.length;k++){
      ch=str.charAt(k);
      if('MTNV'.indexOf(ch)>=0){
        var gx=(2*XS+SW)*u/94,gy=(4+SW)*u/141;
        ctx.save();ctx.translate(x+k*(2*XS+SW+MG)*u-3*gx,y-4.5*gy);ctx.scale(gx,gy);
        glyphNum(ch.toLowerCase(),0,0,100,150,col,1,false);ctx.restore();
      }
    }
  }
  var tdKey='';
  function drawToday(C,dpr){
    var cvs=document.getElementById('tdcv'),h=16,u=h/5,w=Math.ceil((5*(2*XS+SW)+4*MG)*u)+2,key=C.ink+'|'+dpr+'|'+w;
    if(key===tdKey)return;tdKey=key;
    cvs.style.width=w+'px';cvs.style.height=h+'px';cvs.width=Math.round(w*dpr);cvs.height=Math.round(h*dpr);
    var sv=[tcv,tctx,ctx];tcv=cvs;tctx=cvs.getContext('2d');ctx=tctx;
    tctx.setTransform(dpr,0,0,dpr,0,0);tctx.clearRect(0,0,w,h);
    drawMonth('TODAY',1,0,h,C.ink,dpr);
    tcv=sv[0];tctx=sv[1];ctx=sv[2];
  }
  function drawTitle(C,dpr){
    var w=tcv.clientWidth,h=tcv.clientHeight;
    var key=ym.y+'|'+ym.m+'|'+C.ink+'|'+C.mute+'|'+dpr+'|'+w;
    if(key===tKey||!w)return;tKey=key;
    tcv.width=Math.round(w*dpr);tcv.height=Math.round(h*dpr);
    tctx.setTransform(dpr,0,0,dpr,0,0);tctx.clearRect(0,0,w,h);
    var main=ctx;ctx=tctx;
    glyphNum(String(ym.y),0,0,w,h*.2,C.mute,.9,true);
    drawMonth(MON[ym.m],1,h*.3,h*.7-1,C.ink,dpr);
    ctx=main;
  }
  function draw(){
    if(!W||!inf)return;
    var C=colors();
    drawTitle(C,dpr);drawToday(C,dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalAlpha=1;
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    hits=[];

    var gw=W-1,gh=H-HEAD-1,i,s=0,cw=[],rw=[],xs=[0],ys=[HEAD];
    for(i=0;i<7;i++){var a=interp(CW,i-fc);cw.push(a);s+=a}
    for(i=0;i<7;i++){cw[i]=cw[i]/s*gw;xs.push(xs[i]+cw[i])}
    s=0;
    for(i=0;i<inf.rows;i++){var b=interp(RW,i-fr);rw.push(b);s+=b}
    for(i=0;i<inf.rows;i++){rw[i]=rw[i]/s*gh;ys.push(ys[i]+rw[i])}
    G={xs:xs,ys:ys,rows:inf.rows};

    var r,c,idx;
    for(r=0;r<inf.rows;r++)for(c=0;c<7;c++){
      idx=r*7+c;
      if(idx<inf.start||idx>=inf.start+inf.N){ctx.fillStyle=C.bg2;ctx.beginPath();
        [[xs[c],ys[r]],[xs[c]+cw[c],ys[r]],[xs[c]+cw[c],ys[r]+rw[r]],[xs[c],ys[r]+rw[r]]].forEach(function(p,i){
          var q=dispAt(p[0],p[1]);if(i)ctx.lineTo(p[0]+q[0],p[1]+q[1]);else ctx.moveTo(p[0]+q[0],p[1]+q[1]);
        });ctx.closePath();ctx.fill()}
    }

    /* line hierarchy: plain lines hairline; the selected cell's row/column edges and the outer frame step up */
    var sc=Math.round(fc),sr=Math.round(fr),yb=ys[inf.rows];
    var wo=[0,0];
    function gl(horiz,pos,strong){
      ctx.strokeStyle=strong?C.mute:C.line;ctx.lineWidth=1;ctx.beginPath();
      var q=Math.round(pos)+.5,n,k2,len=horiz?W:yb;
      n=Math.max(2,Math.ceil(len/10));
      for(k2=0;k2<=n;k2++){
        var u2=len*k2/n;
        if(horiz)wp(u2,q,wo);else wp(q,u2,wo);
        if(k2)ctx.lineTo(wo[0],wo[1]);else ctx.moveTo(wo[0],wo[1]);
      }
      ctx.stroke();
    }
    for(i=0;i<=7;i++)if(!(i===sc||i===sc+1||i===0||i===7))gl(false,xs[i],false);
    for(i=0;i<=inf.rows;i++)if(!(i===sr||i===sr+1||i===0||i===inf.rows))gl(true,ys[i],false);
    gl(true,0,false);
    for(i=0;i<=7;i++)if(i===sc||i===sc+1||i===0||i===7)gl(false,xs[i],true);
    for(i=0;i<=inf.rows;i++)if(i===sr||i===sr+1||i===0||i===inf.rows)gl(true,ys[i],true);

    ctx.textBaseline='middle';
    var LET=['s','m','t','w','t','f','s'];
    for(c=0;c<7;c++){
      var near=Math.abs(c-fc)<.5;
      var hd2=dispAt(xs[c]+cw[c]/2,HEAD/2);
      var gh=18,gw=Math.max(6,Math.min(cw[c]-6,40));
      glyphNum(LET[c],xs[c]+cw[c]/2+hd2[0]-gw/2,HEAD/2+hd2[1]-gh/2,gw,gh,near?C.ink:C.mute,near?.95:.8,false);
    }

    var rc=Math.round(fc),rr=Math.round(fr);
    for(r=0;r<inf.rows;r++)for(c=0;c<7;c++){
      idx=r*7+c;
      if(idx<inf.start||idx>=inf.start+inf.N)continue;
      var day=idx-inf.start+1;
      var x=xs[c],y=ys[r],w=cw[c],h=rw[r];
      var hn0=hits.length,cpts=[[x,y],[x+w/2,y],[x+w,y],[x+w,y+h/2],[x+w,y+h],[x+w/2,y+h],[x,y+h],[x,y+h/2]],cd=[0,0],cq;
      ctx.save();ctx.beginPath();
      cpts.forEach(function(p,i){
        cq=dispAt(p[0],p[1]);cd[0]+=cq[0]/8;cd[1]+=cq[1]/8;
        if(i)ctx.lineTo(p[0]+cq[0],p[1]+cq[1]);else ctx.moveTo(p[0]+cq[0],p[1]+cq[1]);
      });
      ctx.closePath();ctx.clip();ctx.translate(cd[0],cd[1]);
      var isToday=(ym.y===T.getFullYear()&&ym.m===T.getMonth()&&day===T.getDate());
      cellD=Math.max(Math.abs(c-fc),Math.abs(r-fr));
      cellRed=(c===0)||!!HOL[key(ym.y,ym.m,day)];
      drawCell(day,x,y,w,h,isToday,(r===rr&&c===rc),list(day),C);
      ctx.restore();
      for(var hq=hn0;hq<hits.length;hq++){hits[hq].x+=cd[0];hits[hq].y+=cd[1]}
    }

    /* selection: thick corner brackets (ㄱ ㄴ) on all four corners */
    if(rr<inf.rows){
      var bd=dispAt(xs[rc]+cw[rc]/2,ys[rr]+rw[rr]/2);
      ctx.save();ctx.translate(bd[0],bd[1]);
      var bx0=xs[rc],by0=ys[rr],bx1=xs[rc]+cw[rc],by1=ys[rr]+rw[rr];
      var bw=clamp(Math.min(cw[rc],rw[rr])*.1,7,22),lw=3.3,o=lw/2;
      bx0+=o;by0+=o;bx1-=o;by1-=o;
      ctx.strokeStyle=C.ink;ctx.lineWidth=lw;ctx.lineCap='butt';ctx.lineJoin='miter';
      ctx.beginPath();
      ctx.moveTo(bx0,by0+bw);ctx.lineTo(bx0,by0);ctx.lineTo(bx0+bw,by0);
      ctx.moveTo(bx1-bw,by0);ctx.lineTo(bx1,by0);ctx.lineTo(bx1,by0+bw);
      ctx.moveTo(bx1,by1-bw);ctx.lineTo(bx1,by1);ctx.lineTo(bx1-bw,by1);
      ctx.moveTo(bx0+bw,by1);ctx.lineTo(bx0,by1);ctx.lineTo(bx0,by1-bw);
      ctx.stroke();ctx.restore();
    }
  }

  var raf=0,last=0;
  function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(step)}}
  function step(t){
    raf=0;
    var dt=Math.min(.05,(t-last)/1000);last=t;
    if(leaving.length){
      var nowT=performance.now(),keep=[],rm=false;
      leaving.forEach(function(L){
        if(nowT-L.t0>=LEAVE_HOLD+LEAVE_DUR){var ix=L.arr.indexOf(L.o);if(ix>=0)L.arr.splice(ix,1);rm=true}else keep.push(L);
      });
      leaving=keep;if(rm){save();labels()}
    }
    var k=reduce?1:1-Math.exp(-dt*(dragging?26:12));
    fc+=(tc-fc)*k;fr+=(tr-fr)*k;
    listA+=((listOpen?1:0)-listA)*(reduce?1:1-Math.exp(-dt*5.5));hovA+=((hovOn&&!listOpen?1:0)-hovA)*(reduce?1:1-Math.exp(-dt*10));if(Math.abs(hovA-(hovOn&&!listOpen?1:0))<.01)hovA=hovOn&&!listOpen?1:0;if(Math.abs(listA-(listOpen?1:0))<.004)listA=listOpen?1:0;
    if(!reduce){
      pv+=(-(pa-1)*42-pv*7)*dt;pa+=pv*dt;
      jvx+=(-(jx-ptx)*5-jvx*4.4)*dt;jvy+=(-(jy-pty)*5-jvy*4.4)*dt;
      var km=1-Math.exp(-dt*2.5);mx+=(tmx-mx)*km;my+=(tmy-my)*km;
      jx=clamp(jx+jvx*dt,-34,34);jy=clamp(jy+jvy*dt,-34,34);
      act=Math.max(0,act-dt*.5);phase+=dt*(.1+.5*act);
    }
    if(morphT<1)morphT=Math.min(1,morphT+dt/.8);
    var wob=!reduce&&(Math.abs(pa-1)+Math.abs(pv)>.01||morphT<1||Math.abs(jx)+Math.abs(jy)+Math.abs(jvx)*.1+Math.abs(jvy)*.1>.08||act>.005);
    if(Math.abs(tc-fc)<.002&&Math.abs(tr-fr)<.002&&!dragging&&!wob&&listA===(listOpen?1:0)&&hovA===(hovOn&&!listOpen?1:0)&&!leaving.length){fc=tc;fr=tr;draw();return}
    draw();
    raf=requestAnimationFrame(step);
  }

  function layout(force){
    inf=info();
    var w=wrap.clientWidth,hh=wrap.clientHeight;
    if(!w||!hh)return;
    var k=w+'|'+hh+'|'+inf.rows;
    if(!force&&k===lastKey)return;
    lastKey=k;
    W=w;H=hh;dpr=window.devicePixelRatio||1;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    setTarget(true);kick();
  }
  if(window.ResizeObserver)new ResizeObserver(function(){layout(false)}).observe(wrap);
  else window.addEventListener('resize',function(){layout(false)});

  function pos(e){
    var b=cv.getBoundingClientRect(),k=b.width?cv.clientWidth/b.width:1;
    return {x:(e.clientX-b.left)*k,y:(e.clientY-b.top)*k};
  }
  function cellAt(p){
    var c=-1,r=-1,i;
    for(i=0;i<7;i++)if(p.x>=G.xs[i]&&p.x<G.xs[i+1])c=i;
    for(i=0;i<G.rows;i++)if(p.y>=G.ys[i]&&p.y<G.ys[i+1])r=i;
    if(c<0||r<0)return null;
    var d=r*7+c-inf.start+1;
    return (d>=1&&d<=inf.N)?d:null;
  }

  /* cloth: only a press-and-drag pulls it. The pull offset eases in slowly and sags back with no bounce. */
  var pressed=false,psx=0,psy=0,lpx=0,lpy=0;
  cv.addEventListener('pointerdown',function(e){
    var p=pos(e);pressed=true;psx=p.x;psy=p.y;lpx=p.x;lpy=p.y;tmx=p.x;tmy=p.y;
    if(mx<-500){mx=p.x;my=p.y}
  });
  function releasePull(){pressed=false;kick()}
  cv.addEventListener('pointerup',releasePull);
  cv.addEventListener('pointercancel',releasePull);
  cv.addEventListener('pointermove',function(e){
    if(pressed)return;
    var p=pos(e),d=cellAt(p),on=d===sel;
    if(on!==hovOn){hovOn=on;cv.style.cursor=on?'pointer':'';kick()}
  });
  cv.addEventListener('pointerleave',function(){if(hovOn){hovOn=false;cv.style.cursor='';kick()}});
  var drag=null;
  cv.addEventListener('pointerdown',function(e){
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    var p=pos(e);drag={sx:p.x,sy:p.y,moved:false};
  });
  cv.addEventListener('pointermove',function(e){
    if(!drag)return;
    var p=pos(e);
    if(!drag.moved&&Math.hypot(p.x-drag.sx,p.y-drag.sy)>6){drag.moved=true;dragging=true;cv.classList.add('drag')}
    if(!drag.moved)return;
    tc=clamp(p.x/W*7-.5,0,6);
    tr=clamp((p.y-HEAD)/(H-HEAD)*inf.rows-.5,0,inf.rows-1);
    var d=Math.round(tr)*7+Math.round(tc)-inf.start+1;
    updateSel(clamp(d,1,inf.N));
    kick();
  });
  cv.addEventListener('pointerup',function(e){
    if(!drag)return;
    var d0=drag;drag=null;dragging=false;cv.classList.remove('drag');
    if(d0.moved){goDay(sel,false);return}
    var p=pos(e),settled=Math.abs(fc-tc)<.05&&Math.abs(fr-tr)<.05;
    if(settled){
      for(var i=0;i<hits.length;i++){
        var h=hits[i];
        if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){
          var arr=todos[key(ym.y,ym.m,sel)]||[];
          if(h.k==='t'&&arr[h.i]){var it0=arr[h.i];if(!leaving.some(function(L){return L.o===it0})){it0.d=true;leaving.push({o:it0,arr:arr,t0:performance.now()});save();labels()}kick()}
          else if(h.k==='x'&&arr[h.i]){arr.splice(h.i,1);save();labels();kick()}
          else if(h.k==='a'){openAdd(h)}
          return;
        }
      }
    }
    var d=cellAt(p);
    if(d===sel&&settled){lox=p.x;loy=p.y;listOpen=!listOpen;kick();return}
    if(d)goDay(d,false);
  });
  cv.addEventListener('pointercancel',function(){drag=null;dragging=false;cv.classList.remove('drag');goDay(sel,false)});

  cv.addEventListener('keydown',function(e){
    var m={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
    if(m!==undefined){
      e.preventDefault();
      var d=sel+m;
      if(d<1){shiftMonth(-1);goDay(inf.N+d,true);return}
      if(d>inf.N){var over=d-inf.N;shiftMonth(1);goDay(over,true);return}
      goDay(d,false);return;
    }
    if(e.key==='PageUp'){e.preventDefault();shiftMonth(-1)}
    else if(e.key==='PageDown'){e.preventDefault();shiftMonth(1)}
    else if(e.key==='Home'){e.preventDefault();document.getElementById('today').click()}
    else if(e.key==='Enter'){
      e.preventDefault();
      if(e.isComposing||e.keyCode===229||performance.now()-closedAt<500)return;
      var ah=null;
      for(var q=0;q<hits.length;q++)if(hits[q].k==='a')ah=hits[q];
      if(!listOpen){lox=W/2;loy=H/2;listOpen=true;kick();return}
      openAdd(ah);
    }
  });

  document.getElementById('prev').addEventListener('click',function(){shiftMonth(-1)});
  document.getElementById('next').addEventListener('click',function(){shiftMonth(1)});
  document.getElementById('today').addEventListener('click',function(){
    var same=(ym.y===T.getFullYear()&&ym.m===T.getMonth());
    if(!same){ym={y:T.getFullYear(),m:T.getMonth()};layout(true)}
    goDay(T.getDate(),!same);
  });
  /* inline add: the field opens right on the "+ 추가" pill */
  var inl=document.getElementById('inl');
  function openAdd(h){
    var x,y,w,hh,fs;
    if(h){
      fs=Math.max(16,h.fs);hh=Math.max(34,h.h*1.15);
      w=Math.max(180,Math.min(h.cw-24,h.cw*.6));x=h.cx+(h.cw-w)/2;y=h.y+h.h/2-hh/2;
    }else{
      fs=16;hh=36;x=12;y=H-hh-12;w=W-24;
    }
    inl.style.left=x+'px';inl.style.top=y+'px';inl.style.width=w+'px';inl.style.height=hh+'px';
    inl.style.textAlign='center';inl.style.fontSize=fs+'px';inl.style.display='block';inl.value='';inl.focus();
  }
  function closeAdd(commit){
    if(inl.style.display!=='block')return;
    var v=inl.value.trim();
    inl.style.display='none';inl.value='';
    if(commit&&v){
      var k=key(ym.y,ym.m,sel);
      (todos[k]=todos[k]||[]).push({t:v,d:false});
      save();labels();ensureFont(v);
    }
    kick();
  }
  inl.addEventListener('keydown',function(e){
    if(e.isComposing||e.keyCode===229)return;
    if(e.key==='Enter'){e.preventDefault();closedAt=performance.now();closeAdd(true);cv.focus()}
    else if(e.key==='Escape'){e.preventDefault();closedAt=performance.now();closeAdd(false);cv.focus()}
  });
  inl.addEventListener('blur',function(){closeAdd(true)});

  /* wide screens: show the app inside an iPhone 17 frame (402x874 pt screen), scaled down to fit the window */
  var scaler=document.getElementById('scaler'),device=document.getElementById('device');
  function fit(){}
  function clock(){
    var d=new Date();
    document.getElementById('clock').textContent=d.getHours()+':'+('0'+d.getMinutes()).slice(-2);
  }
  window.addEventListener('resize',fit);
  fit();clock();setInterval(clock,30000);

  if(window.matchMedia){
    var mq=matchMedia('(prefers-color-scheme: dark)');
    if(mq.addEventListener)mq.addEventListener('change',kick);
  }
  new MutationObserver(kick).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  load();
  var all='일월화수목금토요일0123456789+×개더추가:/.';
  Object.keys(todos).forEach(function(k){todos[k].forEach(function(o){all+=o.t})});
  ensureFont(all);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(kick);
  inf=info();
  labels();
  layout(true);
  goDay(sel,true);
})();
</script>
